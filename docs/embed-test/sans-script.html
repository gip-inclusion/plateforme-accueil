<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banc d'essai — hôte sans script</title>
  <link rel="stylesheet" href="host.css">
</head>
<body>
  <header class="faux-site__entete">
    <p class="faux-site__marque">Faux site hôte, sans le script d'embarquement</p>
    <p class="faux-site__note">
      Le cas de repli : l'iframe garde la hauteur fixée ici, personne ne publie
      la bande visible, et la page embarquée doit rester correcte — modale
      centrée par le navigateur, comme avant l'ajout du protocole.
    </p>
  </header>

  <main class="faux-site__contenu">
    <section class="remplissage"><h2>Contenu au-dessus</h2></section>
    <div class="cadre" data-cadre>
      <iframe src="http://localhost:8000/" title="La plateforme de l'inclusion"
              referrerpolicy="no-referrer" width="100%" height="600"></iframe>
    </div>
    <section class="remplissage"><h2>Contenu en-dessous</h2></section>
  </main>
</body>
</html>
