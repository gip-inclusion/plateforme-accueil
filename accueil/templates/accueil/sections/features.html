<section class="section {{ section.modifiers }}" id="{{ section.anchor }}">
  <div class="section__contenu">
    <p class="section__surtitre">{{ content.kicker }}</p>
    <h2 class="section__titre">{{ content.title }}</h2>
    <p class="section__intro">{{ content.intro }}</p>
    <ol class="parcours-frise">
      {% for step in content.steps %}
        <li class="parcours-frise__etape">
          <span class="parcours-frise__num">{{ forloop.counter }}</span>
          <svg class="icone parcours-frise__pic" aria-hidden="true"><use href="#{{ step.icon }}"/></svg>
          <h3 class="parcours-frise__titre">{{ step.title }}</h3>
          <p class="parcours-frise__texte">{{ step.text }}</p>
        </li>
      {% endfor %}
    </ol>
  </div>
</section>
