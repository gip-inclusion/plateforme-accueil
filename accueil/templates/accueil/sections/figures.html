{% load static %}
<section class="stats" aria-label="Chiffres clés">
  <div class="section__contenu">
    <p class="section__surtitre">{{ content.kicker }}</p>
    <h2 class="section__titre">{{ content.title }}</h2>
    <div class="stats__grille">
      {% for indicator in section.values %}
        <div class="stat">
          <img class="stat__illu" src="{% static indicator.image %}" alt="" width="122" height="86">
          <b class="stat__nombre">{{ indicator.value }}</b>
          <span class="stat__label">{{ indicator.label }}</span>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
