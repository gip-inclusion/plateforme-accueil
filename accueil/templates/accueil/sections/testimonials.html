{% load static %}
<section class="section {{ section.modifiers }}" id="{{ section.anchor }}">
  <div class="section__contenu">
    <p class="section__surtitre">{{ content.kicker }}</p>
    <h2 class="section__titre">{{ content.title }}</h2>
    <div class="temoignages__conteneur">
      <div class="temoignages__grille">
        {% for quote in content.quotes %}
          <figure class="temoignage">
            <svg class="icone" aria-hidden="true"><use href="#ri-double-quotes-l"/></svg>
            <blockquote class="temoignage__citation">{{ quote.quote }}</blockquote>
            <figcaption class="temoignage__auteur">
              <b class="temoignage__nom">{{ quote.name }}</b>
              <span class="temoignage__role">{{ quote.role }}</span>
            </figcaption>
          </figure>
        {% endfor %}
      </div>
      <img class="temoignages__illu" src="{% static content.illustration %}" alt="" width="560" height="340">
    </div>
  </div>
</section>
