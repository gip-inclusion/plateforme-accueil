<section class="section {{ section.modifiers }}" id="{{ section.anchor }}" data-recherche-section>
  <div class="section__contenu">
    <p class="section__surtitre">{{ content.kicker }}</p>
    <h2 class="section__titre">{{ content.title }}</h2>
    <p class="section__intro">{{ content.intro }}</p>
    <div class="exemples">
      <p class="exemples__legende">{{ content.legend }}</p>
      <ul class="types-list">
        {% for tag in content.tags %}
          <li class="type-tag"><svg class="icone" aria-hidden="true"><use href="#{{ tag.icon }}"/></svg> {{ tag.label }}</li>
        {% endfor %}
      </ul>
    </div>
    <a class="bouton recherche-cta" href="{{ content.cta_href }}" target="_top">
      <svg class="icone" aria-hidden="true"><use href="#ri-search-line"/></svg>
      <span>{{ content.cta_label }}</span>
    </a>
  </div>
</section>
