{% extends "edition/base.html" %}

{% block titre %}Mot de passe{% endblock %}

{% block contenu %}
  <p class="fil"><a href="{% url 'edition:plan' %}">‹ Plan de la page</a></p>

  <h1>Changer mon mot de passe</h1>

  <form class="editeur c-box" method="post">
    {% csrf_token %}
    {% for champ in form %}
      {% include "edition/_champ.html" with champ=champ %}
    {% endfor %}
    <div class="editeur__actions">
      <a class="btn btn-outline-primary" href="{% url 'edition:plan' %}">Annuler</a>
      <button class="btn btn-primary" type="submit">Enregistrer</button>
    </div>
  </form>
{% endblock %}
