name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        # Only the runtime deps: this job runs migrations, not the test suite.
        run: uv sync --frozen --no-dev

      # Migrations run before the new revision takes traffic. They are additive,
      # so the revision still in place keeps working while they apply. The step
      # is a no-op without DATABASE_URL: the database stays optional, and the
      # page renders the code defaults without one.
      - name: Migrate the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL absent : migrations ignorées."
            exit 0
          fi
          uv run --no-dev python manage.py migrate --noinput
          uv run --no-dev python manage.py sync_sections

      - name: Install Scaleway CLI
        run: |
          SCW_URL=$(curl -fsSL https://api.github.com/repos/scaleway/scaleway-cli/releases/latest | grep -o 'https://[^"]*linux_amd64' | head -1)
          curl -fsSL "$SCW_URL" -o /usr/local/bin/scw
          chmod +x /usr/local/bin/scw

      - name: Configure Scaleway CLI
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          scw init secret-key="$SCW_SECRET_KEY" access-key="$SCW_ACCESS_KEY" \
            organization-id="${{ secrets.SCW_ORG_ID }}" \
            project-id="${{ secrets.SCW_PROJECT_ID }}" \
            send-telemetry=false with-ssh-key=false install-autocomplete=false

      - name: Login to Scaleway container registry
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_REGISTRY: ${{ secrets.SCW_REGISTRY }}
        run: |
          docker login "${SCW_REGISTRY%%/*}" -u nologin --password-stdin <<< "$SCW_SECRET_KEY"

      - name: Build, push and redeploy
        env:
          SCW_REGISTRY: ${{ secrets.SCW_REGISTRY }}
        run: make deploy
