services:
  postgres:
    container_name: plateforme_accueil_postgres
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=plateforme_accueil
      # Without this the container logs `role "root" does not exist` on start.
      - PGUSER=postgres
    # Durability buys nothing for a development database.
    command: -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    restart: unless-stopped
    ports:
      # 5434 on the host: 5432 and 5433 are taken by other projects here.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
